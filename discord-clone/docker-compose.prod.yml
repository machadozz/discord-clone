version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: discord_postgres
    restart: always
    environment:
      POSTGRES_USER: discord
      POSTGRES_PASSWORD: discordpassword
      POSTGRES_DB: discorddb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - discord-net

  redis:
    image: redis:alpine
    container_name: discord_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - discord-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: discord_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://discord:discordpassword@postgres:5432/discorddb?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=supersecret_producao
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://localhost:7880}
    depends_on:
      - postgres
      - redis
    networks:
      - discord-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: discord_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - discord-net

volumes:
  pgdata:
  redisdata:

networks:
  discord-net:
    driver: bridge
